{
  "openapi": "3.0.3",
  "info": {
    "title": "LiveSpace Phase 11 backend API",
    "version": "11-readiness-local",
    "description": "Phase 11 A\u2013H backend APIs implemented and locally validated against PHASE11_ACCEPTANCE.md. Separate deployment review required; no production authorization. Full privacy, role, time, data-source and unavailable-metric semantics in feature guides. Operational readiness is locally validated; production remains NO-GO pending PHASE11_PRODUCTION_READINESS.md."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8080",
      "description": "Local only; deployment not authorized"
    }
  ],
  "paths": {
    "/api/v1/cafes/{cafe}/menu": {
      "get": {
        "summary": "Published menu snapshot and stable QR API URL",
        "description": "Implemented checkpoint contract. Owner access requires actual cafe ownership, including admin accounts. Same-origin cookie writes; 120 requests/minute per client IP per runtime. See MENU_MANAGEMENT.md for complete constraints, errors and cache semantics. No realtime menu events.",
        "security": [],
        "parameters": [
          {
            "name": "cafe",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 10000,
              "default": 0
            }
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 120
            }
          },
          {
            "name": "category_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "product_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "featured",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success. JSON uses Cache-Control: no-store.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Menu"
                }
              }
            }
          },
          "default": {
            "description": "400 malformed JSON; 401 auth; 403 role/origin; 404 hidden/cross-tenant; 409 version, reference, capacity or preview conflict; 413 body; 415 type; 422 validation; 429 rate; 503 storage unavailable. Unexpected errors return sanitized 500.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
