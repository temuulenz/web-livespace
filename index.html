<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
  <title>LiveSpace</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    /* Layout: V1 LiveSpace — cream canvas, brown/orange brand, Comfortaa display + Manrope UI. Semantic sage/amber/terracotta only for atmosphere states. */
    :root {
      --cream: #FBF7F0;
      --paper: #FFFFFF;
      --sand: #FBEEDC;
      --sand2: #FFF4DC;
      --ink: #3E2A17;
      --ink2: #6B5038;
      --ink3: #9A8570;
      --brown: #7B542F;
      --brown2: #5E3F22;
      --orange: #FF9D00;
      --orange2: #E8890A;
      --amberL: #FFCF71;
      --gold: #B6771D;
      --line: #EFE3D1;
      --line2: #E3D5BF;
      --sage: #6F8F5E;
      --sageBg: #E5EEDC;
      --sageT: #4E6B40;
      --amb: #C9862A;
      --ambBg: #FBEACB;
      --ambT: #8A5A12;
      --terra: #C8573E;
      --terraBg: #F7DCD3;
      --terraT: #9A3B26;
      --blue: #1A73E8;
      --closed: #B9AE9E;
      --f-disp: "Comfortaa", "Varela Round", system-ui, sans-serif;
      --f-ui: "Manrope", "Segoe UI", system-ui, sans-serif;
      --r-s: 10px;
      --r-m: 16px;
      --r-l: 24px;
      --sh: 0 10px 30px rgba(62, 42, 23, .10);
      --sh2: 0 18px 50px rgba(62, 42, 23, .18);
      --hd: 64px;
      --tab: 0px;
      color-scheme: light;
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--f-ui);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      z-index: 60;
      background: var(--paper)
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0
    }

    a {
      color: inherit;
      text-decoration: none
    }

    :focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 2px;
      border-radius: 8px
    }

    h1,
    h2,
    h3 {
      font-family: var(--f-disp);
      font-weight: 700;
      color: var(--brown);
      margin: 0;
      text-wrap: balance;
      letter-spacing: -.01em
    }

    .num {
      font-variant-numeric: tabular-nums
    }

    .wrap {
      max-width: 1360px;
      margin: 0 auto;
      padding-left: max(24px, env(safe-area-inset-left, 0px));
      padding-right: max(24px, env(safe-area-inset-right, 0px))
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink2)
    }

    .muted {
      color: var(--ink2)
    }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0)
    }

    /* ---------- header ---------- */
    .hd {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 50;
      background: var(--paper);
      border-bottom: 1px solid #F3E6D2
    }

    .hd-in {
      height: var(--hd);
      display: flex;
      align-items: center;
      gap: 28px;
      padding-left: max(24px, env(safe-area-inset-left, 0px));
      padding-right: max(24px, env(safe-area-inset-right, 0px));
      max-width: 1440px;
      margin: 0 auto
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--f-disp);
      font-weight: 700;
      font-size: 26px;
      color: var(--brown);
      letter-spacing: -.02em
    }

    .logo svg {
      width: 26px;
      height: 26px
    }

    .logo b {
      color: var(--orange2);
      font-weight: 700
    }

    .nav {
      display: flex;
      gap: 6px
    }

    .nav a {
      position: relative;
      padding: 10px 12px;
      font-weight: 600;
      color: var(--ink2);
      border-radius: 10px;
      transition: color .2s
    }

    .nav a:hover {
      color: var(--ink)
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 36px;
      height: 3px;
      border-radius: 2px;
      background: var(--orange);
      transform: translateX(-50%) scaleX(0);
      transition: transform .28s cubic-bezier(.3, 1.4, .5, 1)
    }

    .nav a.on {
      color: var(--ink);
      font-weight: 800
    }

    .nav a.on::after {
      transform: translateX(-50%) scaleX(1)
    }

    .hd-r {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .loc {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--line2);
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px
    }

    .loc svg {
      width: 16px;
      height: 16px
    }

    .ibtn {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line2);
      background: var(--paper);
      transition: transform .15s, background .2s
    }

    .ibtn:hover {
      background: var(--sand2)
    }

    .ibtn:active {
      transform: scale(.92)
    }

    .ibtn svg {
      width: 20px;
      height: 20px
    }

    .cnt {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      background: var(--orange);
      color: var(--ink);
      font-size: 11px;
      font-weight: 800;
      display: grid;
      place-items: center
    }

    .cnt.bump {
      animation: bump .45s cubic-bezier(.3, 1.6, .5, 1)
    }

    @keyframes bump {
      0% {
        transform: scale(1)
      }

      40% {
        transform: scale(1.5)
      }

      100% {
        transform: scale(1)
      }
    }

    .snd-on .s-off {
      display: none
    }

    .snd-off .s-on {
      display: none
    }

    .pop {
      position: fixed;
      z-index: 70;
      top: calc(var(--hd) + env(safe-area-inset-top, 0px) + 8px);
      right: max(16px, env(safe-area-inset-right, 0px));
      width: min(340px, calc(100vw - 32px));
      background: var(--paper);
      border-radius: var(--r-m);
      box-shadow: var(--sh2);
      padding: 18px;
      animation: popIn .22s cubic-bezier(.2, 1.2, .4, 1)
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(.97)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .pop h3 {
      font-size: 18px;
      margin-bottom: 10px
    }

    .tgl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--line)
    }

    .tgl-row:first-of-type {
      border-top: 0
    }

    .tgl-row small {
      display: block;
      color: var(--ink2);
      font-size: 12px
    }

    .sw {
      width: 46px;
      height: 26px;
      border-radius: 13px;
      background: var(--line2);
      position: relative;
      flex: none;
      transition: background .25s
    }

    .sw::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .15);
      transition: transform .28s cubic-bezier(.3, 1.5, .5, 1)
    }

    .sw[aria-checked="true"] {
      background: var(--brown)
    }

    .sw[aria-checked="true"]::after {
      transform: translateX(20px)
    }

    .fav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--line)
    }

    .fav-item a {
      font-weight: 700;
      flex: 1
    }

    /* ---------- buttons, chips ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      transition: transform .15s, background .2s, box-shadow .2s;
      white-space: nowrap
    }

    .btn:active {
      transform: scale(.96)
    }

    .btn svg {
      width: 18px;
      height: 18px
    }

    .btn-p {
      background: var(--brown);
      color: #fff;
      box-shadow: 0 6px 16px rgba(123, 84, 47, .25)
    }

    .btn-p:hover {
      background: var(--brown2)
    }

    .btn-o {
      border: 1.5px solid var(--brown);
      color: var(--brown);
      background: var(--paper)
    }

    .btn-o:hover {
      background: var(--sand2)
    }

    .btn-y {
      background: var(--amberL);
      color: var(--ink)
    }

    .btn-y:hover {
      background: #FFC24D
    }

    .btn-g {
      color: var(--ink2);
      padding: 10px 12px
    }

    .btn-g:hover {
      color: var(--ink)
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--line2);
      background: var(--paper);
      font-weight: 600;
      font-size: 14px;
      transition: background .2s, color .2s, border-color .2s, transform .15s
    }

    .chip svg {
      width: 16px;
      height: 16px
    }

    .chip:hover {
      border-color: var(--brown)
    }

    .chip:active {
      transform: scale(.94)
    }

    .chip[aria-pressed="true"] {
      background: var(--brown);
      border-color: var(--brown);
      color: #fff
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .06em;
      white-space: nowrap
    }

    .b-demo {
      border: 1px dashed #9C8B78;
      color: #7A6A5A;
      background: var(--paper)
    }

    .b-demo::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.4px dashed currentColor
    }

    .b-live {
      background: #E3F1E7;
      color: #2E7D4F
    }

    .b-live::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor
    }

    .b-typ {
      background: #F1EBE3;
      color: var(--ink2)
    }

    .b-typ::before {
      content: "≈";
      font-size: 12px;
      line-height: 1
    }

    .b-fc {
      background: var(--terraBg);
      color: var(--terraT)
    }

    .b-fc::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.4px solid currentColor
    }

    .open-st {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
      color: var(--orange2)
    }

    .open-st svg {
      width: 15px;
      height: 18px
    }

    .open-st.closed {
      color: var(--ink3)
    }

    /* ---------- atmosphere components ---------- */
    .ss {
      display: block
    }

    .ss .wv {
      transform-box: fill-box;
      transform-origin: left center;
      animation: wv calc(2.6s - var(--l, 1)*.35s) ease-in-out infinite
    }

    .ss .wv:nth-of-type(2) {
      animation-delay: .25s
    }

    .ss .wv:nth-of-type(3) {
      animation-delay: .5s
    }

    @keyframes wv {

      0%,
      100% {
        opacity: .25;
        transform: scaleX(.85)
      }

      50% {
        opacity: 1;
        transform: scaleX(1)
      }
    }

    .ss .flip {
      transform-box: fill-box;
      transform-origin: left center;
      animation: flip 3.4s ease-in-out infinite
    }

    @keyframes flip {

      0%,
      55% {
        transform: scaleX(1)
      }

      75%,
      100% {
        transform: scaleX(-1);
        opacity: .0
      }
    }

    .ss .stm {
      animation: stm 2.4s ease-in-out infinite
    }

    .ss .stm:nth-of-type(2) {
      animation-delay: .8s
    }

    .ss .stm:nth-of-type(3) {
      animation-delay: 1.6s
    }

    @keyframes stm {
      0% {
        opacity: 0;
        transform: translateY(6px)
      }

      40% {
        opacity: .9
      }

      100% {
        opacity: 0;
        transform: translateY(-10px)
      }
    }

    .ss .bub {
      transform-box: fill-box;
      transform-origin: bottom left;
      animation: bub 2.4s cubic-bezier(.3, 1.5, .5, 1) infinite
    }

    .ss .bub.b2 {
      animation-delay: .6s
    }

    .ss .bub.b3 {
      animation-delay: 1.1s
    }

    .ss .bub.b4 {
      animation-delay: 1.5s
    }

    @keyframes bub {
      0% {
        transform: scale(0);
        opacity: 0
      }

      15%,
      70% {
        transform: scale(1);
        opacity: 1
      }

      85%,
      100% {
        transform: scale(.6);
        opacity: 0
      }
    }

    .ss[data-l="4"] .bub {
      animation-duration: 1.5s
    }

    .ss .vib {
      animation: vib .12s linear infinite
    }

    @keyframes vib {
      0% {
        transform: translate(0, 0)
      }

      50% {
        transform: translate(.6px, -.6px)
      }

      100% {
        transform: translate(-.5px, .4px)
      }
    }

    .ss .puff {
      animation: puff 1.4s ease-out infinite
    }

    .ss .puff:nth-of-type(2) {
      animation-delay: .45s
    }

    .ss .puff:nth-of-type(3) {
      animation-delay: .9s
    }

    @keyframes puff {
      0% {
        opacity: .8;
        transform: translate(0, 0) scale(.6)
      }

      100% {
        opacity: 0;
        transform: translate(-14px, -6px) scale(1.4)
      }
    }

    .ss .puff {
      transform-box: fill-box;
      transform-origin: center
    }

    .wf .a {
      fill: none;
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke: var(--line2);
      transition: stroke .4s
    }

    .wf .d {
      transition: fill .4s
    }

    .wf.w1 .a1,
    .wf.w2 .a1,
    .wf.w2 .a2,
    .wf.w3 .a,
    .wf.w4 .a {
      stroke: currentColor
    }

    .wf.w1 .a1 {
      animation: blink 2.2s steps(2, end) infinite
    }

    .wf.w2 .on {
      animation: wfp 2s ease-in-out infinite
    }

    .wf.w3 .a {
      animation: wfp 1.6s ease-in-out infinite
    }

    .wf.w4 .a {
      animation: wfp 1s ease-in-out infinite
    }

    .wf .a2 {
      animation-delay: .18s !important
    }

    .wf .a3 {
      animation-delay: .36s !important
    }

    .wf.w0 .a {
      stroke-dasharray: 3 4
    }

    @keyframes wfp {

      0%,
      100% {
        opacity: .45
      }

      45% {
        opacity: 1
      }
    }

    @keyframes blink {
      0% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    .mtr {
      height: 8px;
      border-radius: 4px;
      background: #F1E8DA;
      overflow: hidden
    }

    .mtr i {
      display: block;
      height: 100%;
      border-radius: 4px;
      background: var(--sage);
      transition: width .8s cubic-bezier(.2, .8, .2, 1), background .4s
    }

    .crowd-dots {
      display: inline-flex;
      gap: 3px
    }

    .crowd-dots i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid currentColor
    }

    .crowd-dots i.f {
      background: currentColor
    }

    .c-q {
      color: var(--sage)
    }

    .c-b {
      color: var(--amb)
    }

    .c-y {
      color: var(--terra)
    }

    /* ---------- home ---------- */
    .page {
      animation: pageIn .35s ease-out
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .hero {
      position: relative;
      margin: 28px auto 0;
      max-width: 1360px;
      border-radius: 28px;
      background: linear-gradient(#FCEFDD, #F6E3C7);
      overflow: hidden;
      min-height: 620px
    }

    .hero-bar {
      position: absolute;
      inset: 0 0 auto;
      height: 26px;
      background: var(--brown);
      box-shadow: inset 0 -5px 0 #B6771D
    }

    .lamp {
      position: absolute;
      top: 26px;
      width: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: top center;
      animation: sway 6s ease-in-out infinite
    }

    .lamp:nth-child(odd) {
      animation-delay: -2.5s;
      animation-duration: 7s
    }

    @keyframes sway {

      0%,
      100% {
        transform: rotate(-1.4deg)
      }

      50% {
        transform: rotate(1.4deg)
      }
    }

    .lamp .cord {
      width: 2px;
      background: var(--brown)
    }

    .lamp svg {
      width: 110px;
      height: auto;
      display: block
    }

    .lamp .cone {
      width: 340px;
      height: 360px;
      margin-top: -6px;
      clip-path: polygon(43% 0, 57% 0, 100% 100%, 0 100%);
      background: linear-gradient(rgba(255, 207, 113, .7), rgba(255, 224, 160, 0));
      animation: glow 4s ease-in-out infinite
    }

    @keyframes glow {

      0%,
      100% {
        opacity: .85
      }

      50% {
        opacity: 1
      }
    }

    .lamp .stat {
      position: absolute;
      top: var(--st, 210px);
      text-align: center;
      width: 140px
    }

    .lamp .stat b {
      display: block;
      font-family: var(--f-disp);
      font-size: 36px;
      color: var(--ink);
      font-weight: 700
    }

    .lamp .stat span {
      font-weight: 700;
      color: var(--ink2);
      font-size: 14px
    }

    .arch {
      position: relative;
      z-index: 2;
      width: min(760px, 92%);
      margin: 90px auto 0;
      height: 560px;
      border: 16px solid var(--brown);
      border-bottom: 0;
      border-radius: 380px 380px 0 0;
      background: linear-gradient(#FFF9EC 30%, #F9E6C2);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 120px 48px 0
    }

    .arch h1 {
      font-size: clamp(34px, 5vw, 62px);
      color: var(--ink);
      line-height: 1.08
    }

    .arch h1 em {
      font-style: normal;
      color: var(--brown);
      background: linear-gradient(transparent 58%, var(--amberL) 58%, var(--amberL) 88%, transparent 88%)
    }

    .arch p {
      max-width: 520px;
      color: var(--ink2);
      margin: 18px 0 22px;
      font-size: 16px
    }

    .hsearch {
      display: flex;
      gap: 8px;
      width: min(520px, 100%);
      background: var(--paper);
      padding: 6px;
      border-radius: 16px;
      box-shadow: var(--sh)
    }

    .hsearch input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 10px 12px;
      font-size: 15px;
      background: transparent
    }

    .hsearch svg {
      width: 20px;
      height: 20px;
      align-self: center;
      margin-left: 8px;
      color: var(--ink2)
    }

    .hero .chips {
      justify-content: center;
      margin-top: 16px
    }

    .shelf {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(860px, 96%);
      height: 22px;
      background: var(--gold);
      border-radius: 8px 8px 0 0;
      box-shadow: inset 0 -6px 0 var(--brown)
    }

    .deco {
      position: absolute;
      z-index: 3;
      bottom: 0
    }

    .sec {
      padding-block: 80px 0
    }

    .sec-h {
      text-align: center;
      margin-bottom: 34px
    }

    .sec-h h2 {
      font-size: clamp(28px, 3.4vw, 44px)
    }

    .sec-h p {
      color: var(--ink2);
      margin: 8px auto 0;
      max-width: 560px
    }

    /* ---------- cafe card ---------- */
    .ccard {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r-l);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform .25s cubic-bezier(.3, 1.3, .5, 1), box-shadow .25s;
      position: relative
    }

    .ccard:hover {
      transform: translateY(-4px);
      box-shadow: var(--sh)
    }

    .cc-top {
      display: flex;
      gap: 12px;
      align-items: flex-start
    }

      height: 48px;

    }

    }

    }

    .cc-top .meta {

    }

    .tiles {

    .tile {
      background: var(--cream);
      border-radius: 14px;

      flex-direction: column;

    .tile b {

    .tile small {

    .heart {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1.5px solid var(--line2);
      display: grid;
      place-items: center;
      position: relative;
      flex: none;
      transition: transform .15s, border-color .2s;
      background: var(--paper)
    }

    .heart svg {
      width: 20px;
      height: 20px;
      transition: transform .3s cubic-bezier(.3, 1.8, .5, 1)
    }

    .heart[aria-pressed="true"] {
      border-color: var(--terra);
      color: var(--terra)
    }

    .heart[aria-pressed="true"] svg path {
      fill: var(--terra)

      animation: hb .5s cubic-bezier(.3, 1.8, .5, 1)
    }

    @keyframes hb {
      0% {
        transform: scale(1)
      }

      30% {
        transform: scale(.7)
      }

      70% {
        transform: scale(1.35)
      }

      100% {
        transform: scale(1)
      }
    }

    .heart.burst::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 14px;
      border: 2px solid var(--terra);
      animation: ring .5s ease-out forwards
    }

    @keyframes ring {
      from {
        opacity: 1;
        transform: scale(.8)
      }

      to {
        opacity: 0;
        transform: scale(1.35)
      }
    }

    .cmpb {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1.5px solid var(--line2);
      display: grid;
      place-items: center;
      flex: none;
      background: var(--paper)

    .cmpb svg {
      width: 20px;
      height: 20px

      background: var(--sand2);
      border-color: var(--orange2);
      color: var(--brown)

      margin-bottom: 4px

      overflow: hidden;
      background: #D9E8C2;
      touch-action: none;
      cursor: grab
    }

    .ex-map.drag {
      cursor: grabbing
    }

    .map-inner {
      position: absolute;
      left: 0;
      top: 0;
      width: 1000px;
      height: 680px;
      transform-origin: 0 0;
      will-change: transform
    }

    .map-inner.ease {
      transition: transform .5s cubic-bezier(.2, .8, .2, 1)
    }

    .map-inner svg.base {
      position: absolute;
      inset: 0;
      width: 1000px;
      height: 680px
    }

    .mk-layer {
      position: absolute;
      inset: 0
    }

    .mk {
      position: absolute;
      transform: translate(-50%, -100%) scale(var(--inv, 1));
      transform-origin: 50% 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      z-index: 2
    }

    .mk.dim {
      opacity: .32;
      filter: grayscale(.4);
      z-index: 1
    }

    .mk.sel {
      z-index: 5
    }

    .mk-pinw {
      position: relative;
      width: 40px;
      height: 48px;
      transition: transform .2s
    }

    .mk:hover .mk-pinw {
      transform: translateY(-3px)
    }

    .mk-pinw svg {
      width: 40px;
      height: 48px;
      filter: drop-shadow(0 4px 4px rgba(62, 42, 23, .25))
    }

    .mk.sel .mk-pinw {
      animation: mpop .5s cubic-bezier(.3, 1.6, .5, 1) forwards
    }

    @keyframes mpop {
      0% {
        transform: scale(1)
      }

      35% {
        transform: scale(1.42) translateY(-4px)
      }

      65% {
        transform: scale(1.12)
      }

      100% {
        transform: scale(1.25) translateY(-3px)
      }
    }

    .mk-ring {
      position: absolute;
      left: 50%;
      top: 44px;
      width: 26px;
      height: 12px;
      margin-left: -13px;
      border-radius: 50%;
      border: 2px solid var(--pc, var(--sage));
      animation: mring var(--pd, 3s) ease-out infinite;
      pointer-events: none
    }

    @keyframes mring {
      0% {
        transform: scale(.6);
        opacity: .9
      }

      100% {
        transform: scale(2.6);
        opacity: 0
      }
    }

      align-items: center;
      gap: 5px;
      background: var(--paper);
      border-radius: 999px;

      transition: border-color .2s

    .mk.hov .mk-pill {

      height: 14px;
      color: var(--ink2);

    }

    .mk-pill .sg svg {

      height: 14px
    }

    .mk-pill .sep {

      height: 10px;
      background: var(--line2)

    .mk-name {

      font-weight: 800;
      background: var(--brown);
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
      opacity: 0;
      transform: translateY(-4px) scale(.9);

      white-space: nowrap;
      pointer-events: none
    }

    .mk:hover .mk-name,
    .mk.sel .mk-name,
    .mk.hov .mk-name {

      transform: none
    }

    .mk.closed .mk-pill {

  <section class="card"><div class="card-h"><h2>Танхимын төлөв</h2></div><div class="occ-ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="60" fill="none" stroke="#F1E8DA" stroke-width="16"/><circle class="v" id="occC" cx="75" cy="75" r="60" fill="none" stroke="#C8573E" stroke-width="16" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" transform="rotate(-90 75 75)"/><text x="75" y="80" text-anchor="middle" font-size="30" font-weight="800" font-family="Manrope" fill="#3E2A17" id="occT">0%</text><text x="75" y="100" text-anchor="middle" font-size="11" fill="#6B5038" font-family="Manrope">дүүрсэн</text></svg>
   <div style="display:grid;grid-template-columns:repeat(3,auto);gap:22px"><div><small class="muted">Сул суудал</small><b class="num" style="display:block;font-size:28px" id="stFree">—</b></div><div><small class="muted">Дуу чимээ</small><b style="display:block;font-size:16px;margin-top:6px">${SS[4].t}</b></div><div><small class="muted">Хүлээлт</small><b class="num" style="display:block;font-size:28px">~8 мин</b></div></div></div>
   <div class="plan-wrap" id="planWrap" style="margin-top:16px"></div></section>
  <div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Юу анхаарах вэ</span>
   <div class="ins"><span>${I.chart.replace('<svg', '<svg width="22" height="22"')}</span><div><b>Хүмүүс ердийнхөөс хурдан нэмэгдэж байна</b><small>Сүүлийн 30 минутад +18% (ердийн +8%) · <span class="badge b-typ">ДУНДАЖ</span></small></div></div>
   <div class="ins a"><span>${I.clock.replace('<svg', '<svg width="22" height="22"')}</span><div><b>Оргил ачаалал ~35 минутын дараа</b><small>Баристагийн нэмэлт ээлж хэрэгтэй байж магадгүй · <span class="badge b-fc">ТААМАГ</span></small></div></div>
   <div class="ins"><span style="color:var(--brown)">${ssGlyph(4).replace('<svg', '<svg width="22" height="22"')}</span><div><b>Дуу чимээ энэ цагийн хэвийн хэмжээнээс өндөр</b><small>«Хүнсний зах шиг» — ердийн «Тайван кафе шиг»</small></div></div></div>
 </div>
 <div style="display:flex;flex-direction:column;gap:20px">
  <section class="card"><div class="card-h"><h2>Түр төлөв</h2></div><div id="tsList" style="display:flex;flex-direction:column;gap:8px"></div>
   <div class="chips" style="margin-top:12px">${['Wi-Fi ажиллахгүй', 'Суудал хязгаартай', 'Арга хэмжээ болж байна', 'Чимээгүй хэсэг түр хаалттай'].map(t => `<button class="chip" data-ts="${t}">+ ${t}</button>`).join('')}</div>
   <div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap"><small class="muted">Дуусах:</small><div class="seg" id="expSeg"><span class="ind-s"></span>${['30 мин', '1 цаг', '2 цаг', 'Өдрийн эцэс'].map((t, i) => `<button data-exp="${t}" aria-selected="${i === 2}">${t}</button>`).join('')}</div></div></section>
  <section class="amb"><div style="display:flex;gap:10px;align-items:center"><h3>ДАСАН ЗОХИЦОХ ОРЧИН</h3><span class="badge" style="border:1px solid var(--amberL);color:var(--amberL)">ЗӨВХӨН ЗӨВЛӨМЖ</span></div>
   <span>Одоо: ачаалал өндөр · «хүнсний зах шиг» чимээтэй</span>
   <div class="seg" id="musSeg"><span class="ind-s"></span><button data-mus="calm" aria-selected="true">Тайван</button><button data-mus="mid" aria-selected="false">Дунд</button><button data-mus="up" aria-selected="false">Эрч хүчтэй</button></div>
   <div style="display:flex;gap:16px;align-items:center"><div class="eq" id="eq">${'<i></i>'.repeat(6)}</div><div><b style="color:#fff" id="musV">Хөгжмийн дуу 32%</b><br><small id="musR">Санал болгосон: орчны чимээ аль хэдийн өндөр байна.</small></div></div>
   <small style="color:#BFAE95">Тоног төхөөрөмжийг удирдахгүй — зөвхөн ажилтанд санал болгоно.</small></section>
 </div></div></div>${footer()}</div>`;
      fp = new FloorPlan($('#planWrap'), { ...c, occ: 78 }, { sound: 4, onStats: s => { const pct = Math.round((s.total - s.free) / s.total * 100); $('#occC').style.strokeDashoffset = 377 - 377 * pct / 100; animNum($('#occT'), pct, '%'); $('#stFree').textContent = Math.round(s.free / s.total * 100) + '%' } });
      const ts = [{ t: 'Wi-Fi ажиллахгүй', e: '2 цаг' }]; let exp = '2 цаг';
      const rts = () => { $('#tsList').innerHTML = ts.length ? ts.map((x, i) => `<div class="tstat"><div><b>${x.t}</b><small>${x.e}-ийн дараа автоматаар дуусна</small></div><button class="btn btn-g" data-tsx="${i}" style="color:var(--terraT)">Цуцлах</button></div>`).join('') : '<small class="muted">Идэвхтэй түр төлөв алга.</small>'; $$('[data-tsx]').forEach(b => b.onclick = () => { ts.splice(+b.dataset.tsx, 1); Snd.ui('click'); rts() }) }; rts();
      $$('[data-ts]').forEach(b => b.onclick = () => { ts.push({ t: b.dataset.ts, e: exp }); Snd.ui('chime'); toast(`«${b.dataset.ts}» · ${exp}`, true); rts() });
      const segInit = (id, cb) => { const s = $('#' + id); const mv = () => { const b = $('[aria-selected="true"]', s); const ind = $('.ind-s', s); ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft - 4}px)` }; mv(); s.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $$('button', s).forEach(x => x.setAttribute('aria-selected', x === b)); mv(); Snd.ui('click'); cb(b) }) };
      segInit('expSeg', b => exp = b.dataset.exp);
      const mus = { calm: ['.9s', '45%', 'Хөгжмийн дуу 32%', 'Санал болгосон: орчны чимээ аль хэдийн өндөр байна.'], mid: ['.6s', '70%', 'Хөгжмийн дуу 45%', 'Одоогийн чимээтэй зэрэгцээд хөгжим сонсогдохгүй болж магадгүй.'], up: ['.35s', '100%', 'Хөгжмийн дуу 60%', 'Санал болгохгүй: шуугиан улам нэмэгдэнэ.'] };
      const setM = k => { const m = mus[k]; $('#eq').style.setProperty('--es', m[0]); $('#eq').style.setProperty('--eh', m[1]); $('#musV').textContent = m[2]; $('#musR').textContent = m[3] }; setM('calm'); segInit('musSeg', b => setM(b.dataset.mus));
    }

    /* ================= router ================= */
    function route() {
      const h = (location.hash || '#home').slice(1); Snd.stopAmb(); if (fp) { fp.destroy(); fp = null } if (mapCtl) { mapCtl.destroy(); mapCtl = null } if (homeMini) { homeMini.destroy(); homeMini = null } refreshResults = () => { }; closeModal();
      const key = h.startsWith('cafe-') ? 'cafe' : h; $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === key || (key === 'cafe' && a.dataset.nav === 'explore') || (key === 'staff' && a.dataset.nav === 'partner')));
      document.body.classList.toggle('on-explore', key === 'explore');
      if (key !== 'explore') $$('.pv').forEach(p => p.remove());
      if (key === 'explore') renderExplore(); else if (key === 'cafes') renderCafes(); else if (key === 'cafe') renderCafe(h.slice(5)); else if (key === 'about') renderAbout(); else if (key === 'partner') renderPartner(); else if (key === 'staff') renderStaff(); else renderHome();
      if (key !== 'explore') window.scrollTo(0, 0); renderTray()
    }
    document.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (a && a.getAttribute('href') === '#pform') { e.preventDefault(); $('#pform').scrollIntoView({ behavior: Prefs.reduced ? 'auto' : 'smooth' }); return } if (a && !e.defaultPrevented) { Snd.ui('click') } });
    window.addEventListener('hashchange', route);
    let lastMobile = isMobile(); window.addEventListener('resize', () => { const m = isMobile(); if (m !== lastMobile) { lastMobile = m; if ((location.hash || '').startsWith('#explore')) route() } });
    document.documentElement.classList.toggle('rm', Prefs.reduced);
    renderHeaderBits(); route();
  </script>
</body>

</html>
