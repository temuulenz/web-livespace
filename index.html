<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LiveSpace</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="logo.webp">
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hd">
    <div class="hd-in">
      <a class="logo" href="#home" aria-label="LiveSpace нүүр"><b>Live</b><img class="logo-cup" src="logo.webp" alt=""><span>Space</span></a>
      <nav class="nav" aria-label="Үндсэн цэс">
        <a href="#explore" data-nav="explore">Газрын зураг</a>
        <a href="#cafes" data-nav="cafes">Кафенууд</a>
        <a href="#about" data-nav="about">Бидний тухай</a>
        <a href="#partner" data-nav="partner">Хамтын ажиллагаа</a>
      </nav>
      <div class="hd-r">
        <span class="loc" id="locPill"></span>
        <button class="ibtn" id="favBtn" aria-label="Хадгалсан кафенууд"></button>
        <button class="ibtn" id="sndBtn" aria-label="Дуу ба хөдөлгөөний тохиргоо"></button>
      </div>
    </div>
  </header>
  <div class="pop" id="sndPop" hidden></div>
  <div class="pop" id="favPop" hidden></div>
  <main id="app"></main>
  <nav class="tabbar" id="tabbar" aria-label="Гар утасны цэс"></nav>
  <div class="cmp-tray" id="cmpTray" aria-live="polite"></div>
  <div id="modal"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>

</html>
