name: Manual backend verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:sensors
      - run: node scripts/phase11-d1-check.mjs
      - run: npm run cf:check
